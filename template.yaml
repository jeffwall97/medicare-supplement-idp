AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Intelligent document processing pipeline for Medicare Supplement enrollment
  documents. Ingests PDFs/scanned images, extracts fields via Textract
  Queries (template-based), conforms them to a canonical schema, and hands
  off to the existing XML-based Enrollment API.

Metadata:
  cfn-lint:
    config:
      # W1028: false positive on UseMockEnrollmentApi - cfn-lint flags the
      # MockEnrollmentApi reference in SubmitToEnrollmentApiFunction's Fn::If
      # as unreachable when DeployMockEnrollmentApi is False (Stage=prod).
      # That's the intended behavior: the mock resources don't exist in
      # prod, so the branch that would reference them correctly never runs.
      ignore_checks:
        - W1028

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  EnrollmentApiEndpoint:
    Type: String
    Description: >
      Base URL of the existing Enrollment API "insurance update" endpoint.
      Leave blank in dev/test to auto-wire to the built-in mock Enrollment
      API instead (see DeployMockEnrollmentApi condition); leave blank in
      prod (where the mock isn't deployed) to skip submission entirely.
    Default: ""

Conditions:
  DeployMockEnrollmentApi: !Not [!Equals [!Ref Stage, prod]]
  UseMockEnrollmentApi: !And
    - !Not [!Equals [!Ref Stage, prod]]
    - !Equals [!Ref EnrollmentApiEndpoint, ""]

Globals:
  Function:
    Runtime: python3.13
    # x86_64: sam build has no Docker available in this dev environment, so
    # the common layer's pip dependencies (jsonschema -> rpds-py, a native
    # extension) build for whatever platform the local pip resolves against
    # rather than the function's declared architecture. Without a container
    # build (`sam build --use-container`), that resolves to x86_64 wheels
    # regardless of what's set here, so arm64 caused an exec-format failure
    # at runtime. Switch back to arm64 once builds run through a container
    # or CI that can target it correctly.
    Architectures: [x86_64]
    Timeout: 60
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_LOG_LEVEL: INFO
        STAGE: !Ref Stage

Resources:

  DocumentsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub Encryption key for IDP Medicare Supplement pipeline (${Stage})
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          # Textract fetches RawDocumentsBucket objects directly from S3 using its own
          # service identity, not the calling Lambda's credentials - without this,
          # StartDocumentAnalysis jobs fail with S3_OBJECT_INACCESSIBLE against an
          # SSE-KMS bucket using a customer-managed key.
          - Sid: AllowTextractToDecryptS3Objects
            Effect: Allow
            Principal:
              Service: textract.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  DocumentsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/idp-medicare-enrollment-${Stage}"
      TargetKeyId: !Ref DocumentsKmsKey

  RawDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "idp-medicare-enrollment-raw-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref DocumentsKmsKey
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      # Browser-enforced, separate from IAM: request_upload's presigned PUT
      # URL is authorized fine without this, but the page (served from the
      # CloudFront domain) and the S3 REST endpoint are different origins,
      # so the browser itself blocks the PUT unless the bucket allows it.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  RawDocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawDocumentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Textract's async StartDocumentAnalysis fetches the S3 object using its own
          # service identity, not the calling Lambda's role - without this, jobs fail
          # with S3_OBJECT_INACCESSIBLE even though the Lambda itself has S3ReadPolicy.
          - Sid: AllowTextractRead
            Effect: Allow
            Principal:
              Service: textract.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${RawDocumentsBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ProcessedDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "idp-medicare-enrollment-processed-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref DocumentsKmsKey
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  EnrollmentRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "idp-enrollment-records-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: documentId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: ingestedAt
          AttributeType: S
      KeySchema:
        - AttributeName: documentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: ingestedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DocumentsKmsKey

  ProcessingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "idp-processing-dlq-${Stage}"
      KmsMasterKeyId: !Ref DocumentsKmsKey
      MessageRetentionPeriod: 1209600

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "idp-common-${Stage}"
      Description: Shared canonical schema, validator, and Textract query definitions
      ContentUri: src/layers/common/
      CompatibleRuntimes: [python3.13]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13

  PrepareInputFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-prepare-input-${Stage}"
      CodeUri: src/functions/prepare_input/
      Handler: app.handler

  StartTextDetectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-start-text-detection-${Stage}"
      CodeUri: src/functions/start_text_detection/
      Handler: app.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref RawDocumentsBucket
        - Statement:
            - Effect: Allow
              Action: textract:StartDocumentTextDetection
              Resource: "*"
            # See the matching comment on StartTextractAnalysisFunction below:
            # Textract needs the calling role to also decrypt the SSE-KMS
            # object itself, not just the resource-based grants on the
            # bucket/key.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt DocumentsKmsKey.Arn

  CheckTextDetectionStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-check-text-detection-status-${Stage}"
      CodeUri: src/functions/check_text_detection_status/
      Handler: app.handler
      Timeout: 120
      Policies:
        - Statement:
            - Effect: Allow
              Action: textract:GetDocumentTextDetection
              Resource: "*"

  ClassifyDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-classify-document-${Stage}"
      CodeUri: src/functions/classify_document/
      Handler: app.handler
      Layers: [!Ref CommonLayer]

  MarkDocumentProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-mark-document-processing-${Stage}"
      CodeUri: src/functions/mark_document_processing/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref EnrollmentRecordsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref EnrollmentRecordsTable
        - Statement:
            # DynamoDB SSE-KMS needs both: GenerateDataKey to mint a data key
            # on a write with no cached one, Decrypt to use an existing one -
            # a write can hit either depending on KMS's internal data-key
            # cache state, so (like every other writer of this table) grant
            # both rather than relying on which one happens to be cached.
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt DocumentsKmsKey.Arn

  StartTextractAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-start-textract-analysis-${Stage}"
      CodeUri: src/functions/start_textract_analysis/
      Handler: app.handler
      Layers: [!Ref CommonLayer]
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref RawDocumentsBucket
        - Statement:
            - Effect: Allow
              Action: textract:StartDocumentAnalysis
              Resource: "*"
            # Textract's S3 fetch for the async job fails with S3_OBJECT_INACCESSIBLE
            # unless the calling role can also decrypt the object itself - the
            # bucket/key resource policies granting textract.amazonaws.com access
            # aren't sufficient on their own.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt DocumentsKmsKey.Arn

  CheckTextractStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-check-textract-status-${Stage}"
      CodeUri: src/functions/check_textract_status/
      Handler: app.handler
      Timeout: 120
      Environment:
        Variables:
          PROCESSED_BUCKET: !Ref ProcessedDocumentsBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ProcessedDocumentsBucket
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey
              Resource: !GetAtt DocumentsKmsKey.Arn
            - Effect: Allow
              Action: textract:GetDocumentAnalysis
              Resource: "*"

  ParseAndValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-parse-and-validate-${Stage}"
      CodeUri: src/functions/parse_and_validate/
      Handler: app.handler
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          PROCESSED_BUCKET: !Ref ProcessedDocumentsBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ProcessedDocumentsBucket
        - S3WritePolicy:
            BucketName: !Ref ProcessedDocumentsBucket
        - Statement:
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt DocumentsKmsKey.Arn

  StoreCanonicalRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-store-canonical-record-${Stage}"
      CodeUri: src/functions/store_canonical_record/
      Handler: app.handler
      Environment:
        Variables:
          PROCESSED_BUCKET: !Ref ProcessedDocumentsBucket
          TABLE_NAME: !Ref EnrollmentRecordsTable
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ProcessedDocumentsBucket
        - DynamoDBWritePolicy:
            TableName: !Ref EnrollmentRecordsTable
        - Statement:
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt DocumentsKmsKey.Arn

  TransformToXmlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-transform-to-xml-${Stage}"
      CodeUri: src/functions/transform_to_xml/
      Handler: app.handler
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          PROCESSED_BUCKET: !Ref ProcessedDocumentsBucket
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ProcessedDocumentsBucket
        - S3WritePolicy:
            BucketName: !Ref ProcessedDocumentsBucket
        - Statement:
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt DocumentsKmsKey.Arn

  SubmitToEnrollmentApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-submit-enrollment-${Stage}"
      CodeUri: src/functions/submit_enrollment/
      Handler: app.handler
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          PROCESSED_BUCKET: !Ref ProcessedDocumentsBucket
          TABLE_NAME: !Ref EnrollmentRecordsTable
          ENROLLMENT_API_ENDPOINT: !If
            - UseMockEnrollmentApi
            - !Sub "https://${MockEnrollmentApi}.execute-api.${AWS::Region}.amazonaws.com/insurance-update"
            - !Ref EnrollmentApiEndpoint
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ProcessedDocumentsBucket
        - DynamoDBWritePolicy:
            TableName: !Ref EnrollmentRecordsTable
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt DocumentsKmsKey.Arn

  # --- Mock Enrollment API (dev/test only) ---------------------------------
  # Stands in for the real Enrollment API so the pipeline can be exercised
  # end-to-end before that integration is finalized. Auto-wired into
  # SubmitToEnrollmentApiFunction above whenever EnrollmentApiEndpoint is
  # left blank and Stage != prod (see UseMockEnrollmentApi condition).

  MockEnrollmentSubmissionsTable:
    Type: AWS::DynamoDB::Table
    Condition: DeployMockEnrollmentApi
    Properties:
      TableName: !Sub "idp-mock-enrollment-submissions-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  MockEnrollmentApi:
    Type: AWS::Serverless::HttpApi
    Condition: DeployMockEnrollmentApi
    Properties:
      StageName: $default

  MockEnrollmentApiFunction:
    Type: AWS::Serverless::Function
    Condition: DeployMockEnrollmentApi
    Properties:
      FunctionName: !Sub "idp-mock-enrollment-api-${Stage}"
      CodeUri: src/functions/mock_enrollment_api/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref MockEnrollmentSubmissionsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref MockEnrollmentSubmissionsTable
      Events:
        InsuranceUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref MockEnrollmentApi
            Path: /insurance-update
            Method: POST

  # --- Web upload/tracking app -----------------------------------------
  # Lets a user upload an enrollment PDF through a browser and poll its
  # status as it moves through the pipeline. No auth yet (dev-only, matches
  # the Mock Enrollment API's posture) - tighten before handling real PII.

  WebAppApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  RequestUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-request-upload-${Stage}"
      CodeUri: src/functions/request_upload/
      Handler: app.handler
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          RAW_BUCKET: !Ref RawDocumentsBucket
          TABLE_NAME: !Ref EnrollmentRecordsTable
      Policies:
        - S3WritePolicy:
            BucketName: !Ref RawDocumentsBucket
        - DynamoDBWritePolicy:
            TableName: !Ref EnrollmentRecordsTable
        - Statement:
            # generate_presigned_url signs locally and succeeds regardless of
            # permissions - it's the browser's actual PUT, authorized against
            # this role at upload time, that needs these (same lesson as
            # Textract's own S3/KMS access elsewhere in this template, just
            # on the write path instead of the read path). Also covers this
            # function's own PutItem to the KMS-encrypted EnrollmentRecordsTable.
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt DocumentsKmsKey.Arn
      Events:
        RequestUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebAppApi
            Path: /api/documents
            Method: POST

  GetDocumentStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-get-document-status-${Stage}"
      CodeUri: src/functions/get_document_status/
      Handler: app.handler
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          TABLE_NAME: !Ref EnrollmentRecordsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EnrollmentRecordsTable
        - Statement:
            # Reading a KMS-encrypted DynamoDB item needs kms:Decrypt too, not
            # just the dynamodb:GetItem action DynamoDBReadPolicy grants.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt DocumentsKmsKey.Arn
      Events:
        GetDocumentStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebAppApi
            Path: /api/documents/{documentId}
            Method: GET

  EditDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-edit-document-${Stage}"
      CodeUri: src/functions/edit_document/
      Handler: app.handler
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          TABLE_NAME: !Ref EnrollmentRecordsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EnrollmentRecordsTable
        - DynamoDBWritePolicy:
            TableName: !Ref EnrollmentRecordsTable
        - Statement:
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt DocumentsKmsKey.Arn
      Events:
        EditDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebAppApi
            Path: /api/documents/{documentId}
            Method: PATCH

  ResubmitDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-resubmit-document-${Stage}"
      CodeUri: src/functions/resubmit_document/
      Handler: app.handler
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          TABLE_NAME: !Ref EnrollmentRecordsTable
          PROCESSED_BUCKET: !Ref ProcessedDocumentsBucket
          ENROLLMENT_API_ENDPOINT: !If
            - UseMockEnrollmentApi
            - !Sub "https://${MockEnrollmentApi}.execute-api.${AWS::Region}.amazonaws.com/insurance-update"
            - !Ref EnrollmentApiEndpoint
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EnrollmentRecordsTable
        - DynamoDBWritePolicy:
            TableName: !Ref EnrollmentRecordsTable
        - S3WritePolicy:
            BucketName: !Ref ProcessedDocumentsBucket
        - Statement:
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt DocumentsKmsKey.Arn
      Events:
        ResubmitDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebAppApi
            Path: /api/documents/{documentId}/resubmit
            Method: POST

  ListDocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-list-documents-${Stage}"
      CodeUri: src/functions/list_documents/
      Handler: app.handler
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          TABLE_NAME: !Ref EnrollmentRecordsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EnrollmentRecordsTable
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt DocumentsKmsKey.Arn
      Events:
        ListDocuments:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebAppApi
            Path: /api/documents
            Method: GET

  DeleteDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-delete-document-${Stage}"
      CodeUri: src/functions/delete_document/
      Handler: app.handler
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          TABLE_NAME: !Ref EnrollmentRecordsTable
          PROCESSED_BUCKET: !Ref ProcessedDocumentsBucket
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EnrollmentRecordsTable
        - DynamoDBWritePolicy:
            TableName: !Ref EnrollmentRecordsTable
        - Statement:
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt DocumentsKmsKey.Arn
            - Effect: Allow
              Action: s3:DeleteObject
              Resource:
                - !Sub "${RawDocumentsBucket.Arn}/*"
                - !Sub "${ProcessedDocumentsBucket.Arn}/*"
            # DynamoDBWritePolicy covers PutItem/UpdateItem/BatchWriteItem
            # but not DeleteItem - needs its own explicit grant.
            - Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt EnrollmentRecordsTable.Arn
      Events:
        DeleteDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebAppApi
            Path: /api/documents/{documentId}
            Method: DELETE

  ViewDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "idp-view-document-${Stage}"
      CodeUri: src/functions/view_document/
      Handler: app.handler
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          TABLE_NAME: !Ref EnrollmentRecordsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EnrollmentRecordsTable
        - S3ReadPolicy:
            BucketName: !Ref RawDocumentsBucket
        - Statement:
            # generate_presigned_url signs locally and succeeds regardless of
            # permissions - it's the browser's actual GET against the signed
            # URL that needs S3ReadPolicy above, plus this role's own
            # kms:Decrypt for the DynamoDB lookup (same key as everywhere
            # else in this template).
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt DocumentsKmsKey.Arn
      Events:
        ViewDocument:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebAppApi
            Path: /api/documents/{documentId}/view
            Method: GET

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Static assets only, not sensitive - SSE-S3 rather than the shared
      # KMS key avoids granting CloudFront's OAC service principal kms:Decrypt.
      BucketName: !Sub "idp-medicare-enrollment-frontend-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "idp-frontend-oac-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution.Id}"

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            # Required alongside OriginAccessControlId even for OAC (not the
            # legacy OAI) - CloudFormation still validates this block exists.
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: WebAppApiOrigin
            DomainName: !Sub "${WebAppApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed: CachingOptimized
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: WebAppApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # AWS managed: CachingDisabled
            # Forwards all headers/query strings except Host - CloudFront must
            # set its own Host (the execute-api domain) for API Gateway to
            # route correctly; forwarding the viewer's Host would break it.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AWS managed: AllViewerExceptHostHeader
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "idp-medicare-enrollment-pipeline-${Stage}"
      DefinitionUri: statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        PrepareInputFunctionArn: !GetAtt PrepareInputFunction.Arn
        StartTextDetectionFunctionArn: !GetAtt StartTextDetectionFunction.Arn
        CheckTextDetectionStatusFunctionArn: !GetAtt CheckTextDetectionStatusFunction.Arn
        ClassifyDocumentFunctionArn: !GetAtt ClassifyDocumentFunction.Arn
        MarkDocumentProcessingFunctionArn: !GetAtt MarkDocumentProcessingFunction.Arn
        StartTextractAnalysisFunctionArn: !GetAtt StartTextractAnalysisFunction.Arn
        CheckTextractStatusFunctionArn: !GetAtt CheckTextractStatusFunction.Arn
        ParseAndValidateFunctionArn: !GetAtt ParseAndValidateFunction.Arn
        StoreCanonicalRecordFunctionArn: !GetAtt StoreCanonicalRecordFunction.Arn
        TransformToXmlFunctionArn: !GetAtt TransformToXmlFunction.Arn
        SubmitToEnrollmentApiFunctionArn: !GetAtt SubmitToEnrollmentApiFunction.Arn
        DeadLetterQueueUrl: !Ref ProcessingDeadLetterQueue
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PrepareInputFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref StartTextDetectionFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CheckTextDetectionStatusFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ClassifyDocumentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref MarkDocumentProcessingFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref StartTextractAnalysisFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CheckTextractStatusFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ParseAndValidateFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref StoreCanonicalRecordFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref TransformToXmlFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SubmitToEnrollmentApiFunction
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ProcessingDeadLetterQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey
              Resource: !GetAtt DocumentsKmsKey.Arn
      Events:
        DocumentUploaded:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: [Object Created]
              detail:
                bucket:
                  name: [!Ref RawDocumentsBucket]

Outputs:
  RawDocumentsBucketName:
    Value: !Ref RawDocumentsBucket
  ProcessedDocumentsBucketName:
    Value: !Ref ProcessedDocumentsBucket
  EnrollmentRecordsTableName:
    Value: !Ref EnrollmentRecordsTable
  PipelineStateMachineArn:
    Value: !Ref PipelineStateMachine
  MockEnrollmentApiUrl:
    Condition: DeployMockEnrollmentApi
    Value: !Sub "https://${MockEnrollmentApi}.execute-api.${AWS::Region}.amazonaws.com/insurance-update"
  MockEnrollmentSubmissionsTableName:
    Condition: DeployMockEnrollmentApi
    Value: !Ref MockEnrollmentSubmissionsTable
  WebAppApiUrl:
    Value: !Sub "https://${WebAppApi}.execute-api.${AWS::Region}.amazonaws.com"
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  FrontendDistributionDomainName:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
