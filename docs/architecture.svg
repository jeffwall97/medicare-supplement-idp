<svg viewBox="0 0 1310 1440" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Medicare Supplement enrollment IDP pipeline: a document lands in S3, EventBridge starts a Step Functions state machine that classifies it, runs it through Textract, validates and stores a canonical record in DynamoDB, transforms it to XML, and submits it to a mock or real Enrollment API, with any step failure routed to a dead-letter queue.">
  <title>Medicare Supplement Enrollment IDP Pipeline — Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b95000"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b5bdb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1310" height="1440" fill="#f6f8fa"/>

  <text x="655" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#24292f">Medicare Supplement Enrollment — IDP Pipeline</text>
  <text x="655" y="50" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">S3 upload → EventBridge → Step Functions → Textract → canonical record → XML → Enrollment API</text>

  <!-- ===== Ingest ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="280" y="70" width="200" height="46" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
    <text x="380" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Enrollment document</text>
    <text x="380" y="105" text-anchor="middle" font-size="10.5" fill="#57606a">PDF or scanned image</text>

    <line x1="380" y1="116" x2="380" y2="146" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="392" y="135" font-size="10" fill="#24292f">PutObject: incoming/&lt;state&gt;/&lt;file&gt;</text>

    <rect x="240" y="148" width="280" height="54" rx="8" fill="#fff4e5" stroke="#b95000" stroke-width="1.5"/>
    <text x="380" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#6b3600">S3 · RawDocumentsBucket</text>
    <text x="380" y="187" text-anchor="middle" font-size="10" fill="#6b4400">🔒 SSE-KMS · versioned</text>

    <line x1="380" y1="202" x2="380" y2="234" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="392" y="223" font-size="10" fill="#24292f">Object Created event</text>

    <rect x="270" y="234" width="220" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
    <text x="380" y="251" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">Amazon EventBridge</text>
    <text x="380" y="266" text-anchor="middle" font-size="10" fill="#57606a">rule: S3 Object Created</text>

    <line x1="380" y1="274" x2="380" y2="298" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="392" y="290" font-size="10" fill="#24292f">StartExecution</text>
  </g>

  <!-- ===== Step Functions container ===== -->
  <rect x="30" y="300" width="610" height="760" rx="10" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="46" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#24292f">AWS Step Functions — PipelineStateMachine</text>
  <text x="46" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#57606a">Every task below retries on transient errors and Catches to the DLQ (arrow omitted per-task for clarity)</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- 1 ClassifyDocument -->
    <rect x="250" y="350" width="280" height="52" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <text x="390" y="371" text-anchor="middle" font-size="13" font-weight="600">ClassifyDocument</text>
    <text x="390" y="388" text-anchor="middle" font-size="10" fill="#57606a">Lambda · key → state, variant</text>

    <line x1="390" y1="402" x2="390" y2="430" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="402" y="420" font-size="9.5" fill="#24292f">state, variant</text>

    <!-- 2 StartTextractAnalysis -->
    <rect x="250" y="432" width="280" height="52" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <text x="390" y="453" text-anchor="middle" font-size="13" font-weight="600">StartTextractAnalysis</text>
    <text x="390" y="470" text-anchor="middle" font-size="10" fill="#57606a">Lambda · builds query set</text>

    <line x1="390" y1="484" x2="390" y2="512" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="402" y="502" font-size="9.5" fill="#24292f">jobId</text>

    <!-- 3 CheckTextractStatus -->
    <rect x="250" y="514" width="280" height="64" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <text x="390" y="533" text-anchor="middle" font-size="12.5" font-weight="600">WaitForTextract →</text>
    <text x="390" y="548" text-anchor="middle" font-size="12.5" font-weight="600">CheckTextractStatus</text>
    <text x="390" y="564" text-anchor="middle" font-size="10" fill="#57606a">Lambda · polls until SUCCEEDED</text>

    <path d="M250,538 C 208,538 208,566 250,566" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="150" y="556" text-anchor="middle" font-size="9.5" fill="#24292f">wait 15s,</text>
    <text x="150" y="568" text-anchor="middle" font-size="9.5" fill="#24292f">retry</text>

    <line x1="390" y1="578" x2="390" y2="606" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="402" y="596" font-size="9.5" fill="#24292f">SUCCEEDED</text>

    <!-- 4 ParseAndValidate -->
    <rect x="250" y="608" width="280" height="58" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <text x="390" y="628" text-anchor="middle" font-size="13" font-weight="600">ParseAndValidate</text>
    <text x="390" y="644" text-anchor="middle" font-size="10" fill="#57606a">Lambda · answers → canonical</text>
    <text x="390" y="658" text-anchor="middle" font-size="10" fill="#57606a">confidence + schema check</text>

    <line x1="390" y1="666" x2="390" y2="694" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="402" y="684" font-size="9.5" fill="#24292f">canonicalRecordKey, status</text>

    <!-- 5 Decision diamond -->
    <polygon points="390,695 500,745 390,795 280,745" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <text x="390" y="740" text-anchor="middle" font-size="11" font-weight="600">Valid?</text>
    <text x="390" y="754" text-anchor="middle" font-size="9" fill="#57606a">schema + confidence</text>

    <path d="M280,745 L145,745 L145,798" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="150" y="738" font-size="9.5" fill="#24292f">No → NEEDS_REVIEW</text>

    <line x1="390" y1="795" x2="390" y2="823" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="398" y="812" font-size="9.5" fill="#24292f">Yes → READY_FOR_SUBMISSION</text>

    <!-- FlagForReview -->
    <rect x="50" y="800" width="190" height="60" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <text x="145" y="820" text-anchor="middle" font-size="12.5" font-weight="600">FlagForReview</text>
    <text x="145" y="835" text-anchor="middle" font-size="9.5" fill="#57606a">Lambda · status=NEEDS_REVIEW</text>
    <text x="145" y="850" text-anchor="middle" font-size="9" fill="#57606a" font-style="italic">(execution ends)</text>

    <!-- 6 StoreCanonicalRecord -->
    <rect x="250" y="825" width="280" height="54" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <text x="390" y="846" text-anchor="middle" font-size="13" font-weight="600">StoreCanonicalRecord</text>
    <text x="390" y="863" text-anchor="middle" font-size="10" fill="#57606a">Lambda · status=READY_FOR_SUBMISSION</text>

    <line x1="390" y1="879" x2="390" y2="907" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="402" y="897" font-size="9.5" fill="#24292f">canonicalRecordKey</text>

    <!-- 7 TransformToXml -->
    <rect x="250" y="909" width="280" height="54" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <text x="390" y="930" text-anchor="middle" font-size="13" font-weight="600">TransformToXml</text>
    <text x="390" y="947" text-anchor="middle" font-size="10" fill="#57606a">Lambda · canonical → XML</text>

    <line x1="390" y1="963" x2="390" y2="991" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="402" y="981" font-size="9.5" fill="#24292f">xmlKey</text>

    <!-- 8 SubmitToEnrollmentApi -->
    <rect x="250" y="993" width="280" height="54" rx="6" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <text x="390" y="1014" text-anchor="middle" font-size="13" font-weight="600">SubmitToEnrollmentApi</text>
    <text x="390" y="1031" text-anchor="middle" font-size="10" fill="#57606a">Lambda · POST XML → endpoint</text>
  </g>

  <!-- ===== Amazon Textract satellite ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="700" y="432" width="230" height="88" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="815" y="456" text-anchor="middle" font-size="13" font-weight="700">Amazon Textract</text>
    <text x="815" y="472" text-anchor="middle" font-size="10" fill="#57606a" font-style="italic">AWS managed</text>
    <text x="815" y="487" text-anchor="middle" font-size="10" fill="#57606a">async Queries API</text>

    <line x1="530" y1="458" x2="698" y2="470" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="540" y="452" font-size="9.5" fill="#24292f">StartDocumentAnalysis</text>

    <line x1="530" y1="546" x2="698" y2="510" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="540" y="533" font-size="9.5" fill="#24292f">GetDocumentAnalysis</text>
  </g>

  <!-- ===== ProcessedDocumentsBucket ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="740" y="540" width="230" height="430" rx="8" fill="#fff4e5" stroke="#b95000" stroke-width="1.5"/>
    <text x="855" y="565" text-anchor="middle" font-size="13" font-weight="600" fill="#6b3600">S3 · ProcessedDocumentsBucket</text>
    <text x="855" y="581" text-anchor="middle" font-size="10" fill="#6b4400">🔒 SSE-KMS · versioned</text>
    <line x1="755" y1="592" x2="955" y2="592" stroke="#e0a96d" stroke-width="1"/>

    <line x1="530" y1="562" x2="738" y2="562" stroke="#b95000" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    <text x="545" y="556" font-size="9.5" fill="#6b3600">writes textract-output/&lt;id&gt;.json</text>

    <line x1="530" y1="637" x2="738" y2="637" stroke="#b95000" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    <text x="545" y="631" font-size="9.5" fill="#6b3600">writes canonical/&lt;id&gt;.json</text>

    <line x1="530" y1="936" x2="738" y2="936" stroke="#b95000" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    <text x="545" y="930" font-size="9.5" fill="#6b3600">writes xml/&lt;id&gt;.xml</text>
  </g>

  <!-- ===== EnrollmentRecordsTable ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="1010" y="800" width="250" height="260" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="1135" y="826" text-anchor="middle" font-size="12.5" font-weight="600" fill="#26359e">DynamoDB ·</text>
    <text x="1135" y="842" text-anchor="middle" font-size="12.5" font-weight="600" fill="#26359e">EnrollmentRecordsTable</text>
    <text x="1135" y="859" text-anchor="middle" font-size="10" fill="#3b4bab">🔒 SSE-KMS</text>
    <line x1="1025" y1="870" x2="1245" y2="870" stroke="#b7c3f2" stroke-width="1"/>
    <text x="1135" y="890" text-anchor="middle" font-size="9.5" fill="#3b4bab">status, canonicalRecord,</text>
    <text x="1135" y="904" text-anchor="middle" font-size="9.5" fill="#3b4bab">lowConfidenceFields, schemaErrors</text>

    <path d="M145,860 L145,888 L680,888 L680,985 L1008,985" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="160" y="881" font-size="9.5" fill="#26359e">PutItem: NEEDS_REVIEW</text>

    <path d="M530,852 L710,852 L710,1005 L1008,1005" fill="none" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="545" y="845" font-size="9.5" fill="#26359e">PutItem: READY_FOR_SUBMISSION</text>

    <line x1="530" y1="1020" x2="1008" y2="1020" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="545" y="1014" font-size="9.5" fill="#26359e">UpdateItem: submission status</text>
  </g>

  <!-- ===== Fork: Mock vs Real Enrollment API ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <path d="M390,1047 L390,1082 L200,1082 L200,1103" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="205" y="1076" font-size="9.5" fill="#24292f">endpoint blank &amp; Stage≠prod</text>

    <path d="M390,1047 L390,1082 L620,1082 L620,1103" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="500" y="1076" font-size="9.5" fill="#24292f">endpoint set (any stage)</text>

    <!-- Mock Enrollment API (built this session) -->
    <rect x="70" y="1105" width="260" height="90" rx="8" fill="#eaf2ff" stroke="#2f6fed" stroke-width="2"/>
    <text x="200" y="1130" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4fb4">Mock Enrollment API</text>
    <text x="200" y="1147" text-anchor="middle" font-size="10" fill="#1a4fb4">HTTP API + Lambda</text>
    <text x="200" y="1162" text-anchor="middle" font-size="9.5" fill="#57606a">returns &lt;InsuranceUpdateAck&gt;</text>
    <text x="200" y="1176" text-anchor="middle" font-size="9" fill="#57606a" font-style="italic">not deployed when Stage=prod</text>

    <line x1="200" y1="1195" x2="200" y2="1223" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="212" y="1213" font-size="9.5" fill="#1a4fb4">stores XML + ack</text>

    <rect x="70" y="1225" width="260" height="46" rx="6" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="200" y="1244" text-anchor="middle" font-size="10" font-weight="600" fill="#26359e">DynamoDB ·</text>
    <text x="200" y="1258" text-anchor="middle" font-size="9.5" fill="#26359e">MockEnrollmentSubmissionsTable</text>

    <!-- Real Enrollment API -->
    <rect x="490" y="1105" width="260" height="90" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="620" y="1130" text-anchor="middle" font-size="13" font-weight="700">Real Enrollment API</text>
    <text x="620" y="1147" text-anchor="middle" font-size="9.5" fill="#57606a">existing "insurance update"</text>
    <text x="620" y="1162" text-anchor="middle" font-size="9.5" fill="#57606a">endpoint</text>
    <text x="620" y="1177" text-anchor="middle" font-size="9" fill="#57606a" font-style="italic">external — not part of this stack</text>
  </g>

  <!-- ===== DLQ / failure path ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="640" y1="350" x2="1008" y2="350" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>
    <text x="650" y="344" font-size="10" fill="#8a1c1c">Catch: States.ALL (any step) → DLQ</text>

    <rect x="1010" y="330" width="250" height="70" rx="8" fill="#fdeeee" stroke="#cf222e" stroke-width="1.5"/>
    <text x="1135" y="357" text-anchor="middle" font-size="12" font-weight="600" fill="#8a1c1c">SQS · ProcessingDeadLetterQueue</text>
    <text x="1135" y="373" text-anchor="middle" font-size="9.5" fill="#8a1c1c">14-day retention</text>

    <line x1="1135" y1="400" x2="1135" y2="428" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>

    <rect x="1035" y="430" width="200" height="36" rx="18" fill="#ffffff" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="1135" y="453" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8a1c1c">Execution: PipelineFailed</text>
  </g>

  <!-- ===== Legend ===== -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="1305" font-size="12" font-weight="700" fill="#24292f">Legend</text>

    <rect x="40" y="1320" width="16" height="16" rx="3" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
    <text x="62" y="1332" font-size="10.5" fill="#24292f">Step Functions Lambda task</text>

    <rect x="330" y="1320" width="16" height="16" rx="3" fill="#fff4e5" stroke="#b95000" stroke-width="1.5"/>
    <text x="352" y="1332" font-size="10.5" fill="#24292f">S3 bucket (SSE-KMS)</text>

    <rect x="620" y="1320" width="16" height="16" rx="3" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="642" y="1332" font-size="10.5" fill="#24292f">DynamoDB table (SSE-KMS)</text>

    <rect x="40" y="1352" width="16" height="16" rx="3" fill="#ffffff" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="62" y="1364" font-size="10.5" fill="#24292f">External / AWS-managed service</text>

    <rect x="330" y="1352" width="16" height="16" rx="3" fill="#eaf2ff" stroke="#2f6fed" stroke-width="2"/>
    <text x="352" y="1364" font-size="10.5" fill="#24292f">Built for this pipeline (dev/test mock)</text>

    <rect x="620" y="1352" width="16" height="16" rx="3" fill="#fdeeee" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="642" y="1364" font-size="10.5" fill="#24292f">Failure path (DLQ)</text>
  </g>
</svg>
